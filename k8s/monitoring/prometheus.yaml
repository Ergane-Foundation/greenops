apiVersion: v1
kind: ConfigMap
metadata:
  name: greenops-prometheus-config
  namespace: greenops
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    scrape_configs:
      - job_name: greenops-operator
        static_configs:
          - targets: ['greenops-operator.greenops.svc.cluster.local:9400']
      - job_name: flink-operator
        static_configs:
          - targets: ['flink-operator-webhook-service.greenops.svc.cluster.local:9999']
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: greenops-prometheus
  namespace: greenops
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: greenops-prometheus
  namespace: greenops
  labels:
    app: greenops-prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: greenops-prometheus
  template:
    metadata:
      labels:
        app: greenops-prometheus
    spec:
      serviceAccountName: greenops-prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:v2.53.0
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=15d
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: data
              mountPath: /prometheus
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
      volumes:
        - name: config
          configMap:
            name: greenops-prometheus-config
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: greenops-prometheus
  namespace: greenops
  labels:
    app: greenops-prometheus
spec:
  type: ClusterIP
  selector:
    app: greenops-prometheus
  ports:
    - name: http
      port: 9090
      targetPort: 9090
