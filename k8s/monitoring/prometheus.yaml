apiVersion: v1
kind: ConfigMap
metadata:
  name: solstice-prometheus-config
  namespace: solstice
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    scrape_configs:
      - job_name: solstice-operator
        static_configs:
          - targets: ['solstice-operator.solstice.svc.cluster.local:9400']
      - job_name: flink-operator
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [solstice]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            regex: flink-kubernetes-operator
            action: keep
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            regex: "true"
            action: keep
          - source_labels: [__address__]
            regex: '(.+?)(?::\d+)?'
            target_label: __address__
            replacement: '${1}:9999'
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: solstice-prometheus
  namespace: solstice
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: solstice-prometheus
  namespace: solstice
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: solstice-prometheus
  namespace: solstice
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: solstice-prometheus
subjects:
  - kind: ServiceAccount
    name: solstice-prometheus
    namespace: solstice
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: solstice-prometheus
  namespace: solstice
  labels:
    app: solstice-prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: solstice-prometheus
  template:
    metadata:
      labels:
        app: solstice-prometheus
    spec:
      serviceAccountName: solstice-prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:v2.53.0
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=15d
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: data
              mountPath: /prometheus
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
      volumes:
        - name: config
          configMap:
            name: solstice-prometheus-config
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: solstice-prometheus
  namespace: solstice
  labels:
    app: solstice-prometheus
spec:
  type: ClusterIP
  selector:
    app: solstice-prometheus
  ports:
    - name: http
      port: 9090
      targetPort: 9090
