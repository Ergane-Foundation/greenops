apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: greenopscontrollers.greenops.io
spec:
  group: greenops.io
  scope: Namespaced
  names:
    plural: greenopscontrollers
    singular: greenopscontroller
    kind: GreenOpsController
    shortNames:
      - gopsc
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [flinkJobName, flinkNamespace, telemetryEndpoint]
              properties:
                carbonThreshold:
                  type: integer
                  default: 400
                flinkJobName:
                  type: string
                flinkNamespace:
                  type: string
                telemetryEndpoint:
                  type: string
            status:
              type: object
              properties:
                gridStatus:
                  type: string
                carbonIntensity:
                  type: integer
                lastAction:
                  type: string
                lastReconciledAt:
                  type: string
      additionalPrinterColumns:
        - name: Grid
          type: string
          jsonPath: .status.gridStatus
        - name: Carbon
          type: integer
          jsonPath: .status.carbonIntensity
        - name: Action
          type: string
          jsonPath: .status.lastAction
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
