apiVersion: v1
kind: ServiceAccount
metadata:
  name: solstice-dashboard
  namespace: solstice
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: solstice-dashboard
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["solstice.io"]
    resources: ["solsticecontrollers", "solsticecontrollers/status"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: solstice-dashboard
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: solstice-dashboard
subjects:
  - kind: ServiceAccount
    name: solstice-dashboard
    namespace: solstice
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: solstice-dashboard
  namespace: solstice
  labels:
    app: solstice-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: solstice-dashboard
  template:
    metadata:
      labels:
        app: solstice-dashboard
    spec:
      serviceAccountName: solstice-dashboard
      containers:
        - name: dashboard
          image: solstice/dashboard:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          env:
            - name: SOLSTICE_NAMESPACE
              value: "solstice"
            - name: TELEMETRY_URL
              value: "http://solstice-telemetry.solstice.svc.cluster.local:8080/telemetry/status"
            - name: CONTROLLER_NAME
              value: "solstice-flink-controller"
          readinessProbe:
            httpGet: { path: /healthz, port: 8000 }
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: 8000 }
            initialDelaySeconds: 10
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: solstice-dashboard
  namespace: solstice
  labels:
    app: solstice-dashboard
spec:
  type: ClusterIP
  selector:
    app: solstice-dashboard
  ports:
    - name: http
      port: 8000
      targetPort: 8000
