{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "solstice.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "solstice.labels" . | nindent 4 }}
{{- end }}
{{- if .Values.rbac.create }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "solstice.fullname" . }}
  labels:
    {{- include "solstice.labels" . | nindent 4 }}
rules:
  - apiGroups: ["solstice.io"]
    resources: ["solsticecontrollers", "solsticecontrollers/status"]
    verbs: ["get", "list", "watch", "update", "patch", "create"]
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/scale"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["flink.apache.org"]
    resources: ["flinkdeployments", "flinkdeployments/status"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "solstice.fullname" . }}
  labels:
    {{- include "solstice.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "solstice.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "solstice.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
