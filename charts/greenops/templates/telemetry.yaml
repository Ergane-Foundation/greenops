{{- if .Values.telemetry.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "greenops.name" . }}-telemetry
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "greenops.labels" . | nindent 4 }}
    app.kubernetes.io/component: telemetry
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "greenops.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: telemetry
  template:
    metadata:
      labels:
        {{- include "greenops.labels" . | nindent 8 }}
        app.kubernetes.io/component: telemetry
    spec:
      containers:
        - name: telemetry
          image: "{{ .Values.telemetry.image.repository }}:{{ .Values.telemetry.image.tag }}"
          imagePullPolicy: {{ .Values.telemetry.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: CARBON_THRESHOLD_GCO2
              value: {{ .Values.telemetry.carbonThreshold | quote }}
            - name: ELECTRICITY_ZONE
              value: {{ .Values.telemetry.zone | quote }}
            {{- if .Values.telemetry.existingSecret }}
            - name: ELECTRICITY_MAPS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.telemetry.existingSecret }}
                  key: {{ .Values.telemetry.tokenKey }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "greenops.name" . }}-telemetry
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "greenops.labels" . | nindent 4 }}
    app.kubernetes.io/component: telemetry
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ include "greenops.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: telemetry
  ports:
    - name: http
      port: 8080
      targetPort: http
{{- end }}
