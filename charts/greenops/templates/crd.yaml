{{- if .Values.crd.install }}
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: greenopscontrollers.greenops.io
spec:
  group: greenops.io
  scope: Namespaced
  names:
    plural: greenopscontrollers
    singular: greenopscontroller
    kind: GreenOpsController
    shortNames:
      - gopsc
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [flinkJobName, flinkNamespace, telemetryEndpoint]
              properties:
                carbonThreshold:
                  type: integer
                  default: 400
                flinkJobName:
                  type: string
                flinkNamespace:
                  type: string
                telemetryEndpoint:
                  type: string
                cooperativeSuspension:
                  type: boolean
                  default: true
                  description: >-
                    Suspend by patching FlinkDeployment.spec.job.state so the
                    Flink Kubernetes Operator takes the savepoint and shuts the
                    cluster down itself. Disable only where no FlinkDeployment
                    owns the target, in which case the operator triggers a
                    savepoint over REST and scales the Deployment directly.
                nodePowerWatts:
                  type: number
                  default: 250
                flinkRestEndpoint:
                  type: string
                savepointDirectory:
                  type: string
                  default: "s3://greenops/savepoints"
                savepointTimeoutSeconds:
                  type: integer
                  default: 300
            status:
              type: object
              properties:
                gridStatus:
                  type: string
                carbonIntensity:
                  type: integer
                lastAction:
                  type: string
                lastReconciledAt:
                  type: string
                savepointPhase:
                  type: string
                lastSavepointPath:
                  type: string
                lastSavepointAt:
                  type: string
                lastError:
                  type: string
      additionalPrinterColumns:
        - name: Grid
          type: string
          jsonPath: .status.gridStatus
        - name: Carbon
          type: integer
          jsonPath: .status.carbonIntensity
        - name: Action
          type: string
          jsonPath: .status.lastAction
        - name: Savepoint
          type: string
          jsonPath: .status.savepointPhase
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
{{- end }}
