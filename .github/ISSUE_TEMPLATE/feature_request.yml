name: Feature request
description: Suggest a change or a new capability.
labels: ["enhancement", "needs triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do that GreenOps does not let you do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you propose
      description: How it could work. Rough is fine.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: savepoint-path
    attributes:
      label: Does it touch the suspend or resume path?
      description: Changes there need tests showing no job can lose its state.
      options:
        - "No"
        - "Yes"
        - Not sure
    validations:
      required: true
  - type: checkboxes
    id: contribute
    attributes:
      label: Contributing
      options:
        - label: I would like to work on this myself.
