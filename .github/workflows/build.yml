name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  operator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Build and test
        run: mvn -B -f operator/pom.xml verify

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: greenops-operator
          path: operator/target/greenops-operator.jar

  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build frontend
        working-directory: dashboard
        run: |
          npm install --no-audit --no-fund
          npm run build
