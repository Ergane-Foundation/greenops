name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  operator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Build and test
        run: mvn -B -f operator/pom.xml verify

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: solstice-operator
          path: operator/target/solstice-operator.jar

  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build frontend
        working-directory: dashboard
        run: |
          npm install --no-audit --no-fund
          npm run build

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check shell scripts
        run: bash -n scripts/*.sh

      - name: Check manifests parse
        run: |
          python3 -m pip install --quiet pyyaml
          python3 - <<'PY'
          import pathlib, sys, yaml
          failed = False
          for path in sorted(pathlib.Path('k8s').rglob('*.yaml')):
              try:
                  list(yaml.safe_load_all(path.read_text()))
              except yaml.YAMLError as exc:
                  print(f"{path}: {exc}")
                  failed = True
          sys.exit(1 if failed else 0)
          PY

      - name: Check dashboard JSON
        run: python3 -c "import json; json.load(open('grafana/solstice-dashboard.json'))"
